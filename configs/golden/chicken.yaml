# GOLDEN. Closed-form. Chicken (hawk-dove): two lopsided pure equilibria, no
# dominant strategy, mutual aggression worst for everyone.
#
# CONVENTION: first action label = "cooperate" (swerve), second = "defect"
# (straight).  R = both swerve, S = I swerve & they go straight,
# T = I go straight & they swerve, P = both go straight.
#
# Numbers: R=3, S=1, T=4, P=0.
#
# DERIVATION
#
# The 2x2 table (row, column):
#                swerve     straight
#     swerve     (3, 3)      (1, 4)
#     straight   (4, 1)      (0, 0)
#
# 1. Ordering. Chicken requires T > R > S > P  =>  4 > 3 > 1 > 0.  Holds.
#    (Compare the prisoner's dilemma, which needs P > S. Swapping those two
#     cells is the entire difference between the two games.)
#
# 2. Exactly two pure Nash equilibria, both asymmetric:
#      (swerve, straight): row has S=1, deviating to straight pays P=0 < 1;
#                          column has T=4, deviating to swerve pays R=3 < 4.
#                          -> Nash
#      (straight, swerve): symmetric  -> Nash
#      (swerve, swerve):   row deviates to straight, 4 > 3   -> not Nash
#      (straight,straight):row deviates to swerve,   1 > 0   -> not Nash
#    => pureNash has exactly 2 entries and they are lopsided: (1,4) and (4,1).
#
# 3. NO dominant strategy.
#      against swerve:   straight pays 4 > swerve pays 3
#      against straight: straight pays 0 < swerve pays 1
#    => dominant = {row: null, column: null}.
#
# 4. Mutual aggression (straight, straight) = (0, 0) is the worst cell for
#    BOTH players simultaneously. No other cell pays either player less.
#
# 5. Mixed Nash. Let p = Pr(opponent swerves). Indifference:
#      swerve:   p*R + (1-p)*S = 3p + (1-p) = 1 + 2p
#      straight: p*T + (1-p)*P = 4p
#      1 + 2p = 4p  =>  2p = 1  =>  p* = 0.5
#    Both players swerve with probability 0.5; expected payoff = 4 * 0.5 = 2.
#
# 6. Pareto frontier. Welfare: (sw,sw)=6, (sw,st)=5, (st,sw)=5, (st,st)=0.
#    (st,st) is dominated by every other cell. Nothing dominates (sw,sw),
#    (sw,st) or (st,sw) — (sw,sw) beats neither lopsided cell on the winner's
#    coordinate (3 < 4). Frontier = {(sw,sw), (sw,st), (st,sw)} — 3 profiles.
#
# 7. Price of anarchy = best welfare / worst-equilibrium welfare = 6 / 5 = 1.2.
#    Price of stability = 6 / 5 = 1.2 (both equilibria have welfare 5).
#
# EXPECTED THEORY BLOCK
#   pureNash:          exactly 2, both asymmetric
#   mixedNash:         one, swerve with probability 0.5 for both roles
#   dominant:          {row: null, column: null}
#   paretoFrontier:    3 profiles; (straight,straight) NOT among them
#   priceOfAnarchy:    1.2
#   priceOfStability:  1.2
#   archetypeDetected: chicken
# EXPECTED VERDICTS: archetype chicken CONFIRMED.
# Tolerance: 1e-9.

schemaVersion: "1"
family: normal_form

metadata:
  id: golden-chicken
  title: Chicken
  sourceDescription: >
    Two drivers head straight at each other. Whoever swerves loses face;
    whoever holds their nerve wins it. If neither swerves they crash, which is
    the worst outcome for both.
  tags: [golden, normal_form, chicken, anti_coordination]

seed: 20260906

