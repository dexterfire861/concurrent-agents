schemaVersion: "1"
family: normal_form

metadata:
  id: adversarial-prisoners-dilemma-no-dominance
  title: Prisoner's dilemma where defection is not dominant
  sourceDescription: >
    Two suspects are questioned separately. Talking is tempting, but if both
    talk the case collapses on both of them and they each end up with nothing.
  tags: [adversarial, normal_form, prisoners_dilemma, dominance, false_claim]

seed: 20260906

population:
  size: 2
  roles:
    - id: row
      share: 0.5
      persona: "You are the first suspect."
    - id: column
      share: 0.5
      persona: "You are the second suspect."

actions:
  kind: discrete
  actions: [C, D]

payoff:
  kind: symmetric_2x2
  R: 3
  S: 1
  T: 5
  P: 0

protocol:
  regime: simultaneous
  repetition:
    rounds: 1
    termination: fixed

information:
  observes: [own_action, own_payoff, full_profile]

communication:
  kind: none

sweep:
  axes: []
  replicates: 1
  maxCells: 1

claims:
  - kind: archetype
    value: prisoners_dilemma
  - kind: dominant_strategy
    role: all
    action: D
    strict: true
